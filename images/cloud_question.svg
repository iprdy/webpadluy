<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" width="100%" height="100%">
  <defs>
    <!-- Soft shadow filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#1e293b" flood-opacity="0.12" />
    </filter>
    
    <!-- Blush gradient -->
    <radialGradient id="blush" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffb3c6" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#ffb3c6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style>
    @keyframes float {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
      100% { transform: translateY(0px); }
    }
    @keyframes questionFloat {
      0% { transform: translateY(0px) rotate(-6deg); }
      50% { transform: translateY(-12px) rotate(6deg); }
      100% { transform: translateY(0px) rotate(-6deg); }
    }
    @keyframes blink {
      0%, 90%, 100% { transform: scaleY(1); }
      95% { transform: scaleY(0.1); }
    }
    
    .floating-cloud {
      animation: float 4s ease-in-out infinite;
      transform-origin: 150px 200px;
    }
    
    .floating-question {
      animation: questionFloat 3.2s ease-in-out infinite;
      transform-origin: 150px 100px;
    }
    
    .eye {
      animation: blink 4s infinite;
      transform-origin: 50% 50%;
    }
  </style>

  <!-- Sky decoration: small stars or dots -->
  <g opacity="0.6">
    <circle cx="50" cy="100" r="3" fill="#ffffff" opacity="0.8" />
    <circle cx="250" cy="120" r="2" fill="#ffffff" opacity="0.9" />
    <circle cx="80" cy="240" r="1.5" fill="#ffffff" opacity="0.7" />
    <circle cx="230" cy="280" r="2.5" fill="#ffffff" opacity="0.8" />
  </g>

  <!-- Floating Question Mark Group -->
  <g class="floating-question">
    <!-- Little glow stars around it -->
    <path d="M 110 80 L 113 86 L 119 88 L 113 90 L 110 96 L 107 90 L 101 88 L 107 86 Z" fill="#FFE066" opacity="0.8" />
    <path d="M 185 105 L 187 110 L 192 112 L 187 114 L 185 119 L 183 114 L 178 112 L 183 110 Z" fill="#FFE066" opacity="0.8" />
    
    <!-- Main question mark text -->
    <text x="150" y="115" font-family="'Outfit', 'Inter', 'Segoe UI', sans-serif" font-size="76" font-weight="900" fill="#ffffff" text-anchor="middle" filter="url(#shadow)">?</text>
  </g>

  <!-- Cute Animated Cloud Character Group -->
  <g class="floating-cloud">
    <!-- Cloud Shadow -->
    <ellipse cx="150" cy="265" rx="70" ry="10" fill="#71a1eb" opacity="0.25" />
    
    <!-- Main Cloud Body Path -->
    <path d="M 100 235 
             C 80 235, 65 218, 65 195 
             C 65 175, 82 160, 102 160 
             C 104 140, 122 125, 142 125 
             C 152 125, 162 130, 168 138
             C 176 128, 190 120, 205 120
             C 225 120, 241 135, 243 155
             C 255 160, 265 175, 265 192
             C 265 212, 250 228, 230 228 
             H 100 Z" 
          fill="#ffffff" 
          filter="url(#shadow)" />
          
    <!-- Blushing cheeks -->
    <circle cx="115" cy="188" r="11" fill="url(#blush)" />
    <circle cx="185" cy="188" r="11" fill="url(#blush)" />
    
    <!-- Eyes -->
    <!-- Left Eye -->
    <g class="eye" style="transform-origin: 125px 178px;">
      <circle cx="125" cy="178" r="5" fill="#1e293b" />
      <circle cx="123.5" cy="176.5" r="1.8" fill="#ffffff" />
    </g>
    <!-- Right Eye -->
    <g class="eye" style="transform-origin: 175px 178px;">
      <circle cx="175" cy="178" r="5" fill="#1e293b" />
      <circle cx="173.5" cy="176.5" r="1.8" fill="#ffffff" />
    </g>
    
    <!-- Happy Smile -->
    <path d="M 145 186 Q 150 192 155 186" stroke="#1e293b" stroke-width="3" stroke-linecap="round" fill="none" />
  </g>
</svg>
